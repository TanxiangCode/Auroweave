[package]
name = "AuroDaemon"
version = "0.1.0"
authors = ["TanXiang"]
edition = "2021"

[[bin]]
name = "AuroDaemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Services", "Win32_System_SystemServices", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_JobObjects"] }
windows-service = "0.7.0"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11.0"
aes-gcm = "0.11.0"
