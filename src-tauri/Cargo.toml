[package]
name = "auroweave"
version.workspace = true
description = "Auroweave — 下一代极简跨平台代理客户端"
authors = ["TanXiang"]
edition = "2021"
rust-version = "1.77"

[lib]
# Windows 下 lib 与 bin 同名会冲突，加 _lib 后缀
name = "auroweave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
cc = "1.0"


[dependencies]
# Tauri 核心
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
# 软件自更新：检查 GitHub Release + 下载安装包 + 重启生效。
# updater 依赖 process 插件做重启，签名为固定密钥（见 bundle > updater）。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Base64 & URL 解析
base64 = "0.22"
url = "2.5"
urlencoding = "2.1"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# HTTP 客户端（订阅拉取、测速）
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# 进程信息（App-Matrix）
sysinfo = "0.31"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"

# 错误处理
thiserror = "1"
anyhow = "1"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# UUID（连接计数器等）
uuid = { version = "1", features = ["v4"] }
regex = "1.10"
tauri-plugin-single-instance = "2.0.0-rc.5"

sha2 = "0.10.9"
rusqlite = { version = "0.31.0", features = ["bundled"] }
lazy_static = "1.5.0"
tauri-plugin-autostart = "2"
[target.'cfg(target_os = "macos")'.dependencies]
# Dock 图标恢复：Accessory→Regular 切回后重设 NSApplication 图标（dev 裸二进制无 Info.plist 图标，会显示 exec 通用图标）；版本对齐依赖树中 wry/tao 所用 objc2 生态
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading"
] }

[profile.release]
# 发布构建：优化体积
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
